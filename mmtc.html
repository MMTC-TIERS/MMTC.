<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MMTC | PvP Tiers</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0d16;--pan:#141829;--pan2:#1b2033;--line:#262d46;--tx:#eef0fa;--mu:#8a92b2;--t1:#ffc83d;--t2:#b4c4e0;--t3:#e0955a;--t4:#5ec48a;--t5:#8a91ac;
--grad:linear-gradient(135deg,#6a5cff,#b84cf0 55%,#ff7eb3);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f1f2f8;--pan:#fff;--pan2:#eceefa;--line:#d9dcee;--tx:#171a2b;--mu:#5d647f}}
*{box-sizing:border-box}html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font-family:'Bricolage Grotesque',system-ui,sans-serif;
background-image:radial-gradient(800px 380px at 8% -8%,#6a5cff30,transparent),radial-gradient(700px 340px at 100% 0,#ff7eb322,transparent);background-repeat:no-repeat}
button{font:inherit;color:inherit}
.w{max-width:1240px;margin:0 auto;padding:16px 14px 60px}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.logo{font-weight:800;font-size:34px;letter-spacing:-1px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
.sp{flex:1}
input{background:var(--pan);border:1px solid var(--line);color:var(--tx);border-radius:11px;padding:10px 14px;font:inherit;width:240px;max-width:100%}
input:focus-visible,button:focus-visible{outline:2px solid #b84cf0;outline-offset:2px}
.ic{width:30px;height:30px;display:block;flex:none}
#nav{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:16px;scrollbar-width:thin}
#nav button{flex:none;min-width:96px;background:var(--pan);border:1px solid var(--line);border-radius:14px;padding:10px 14px;color:var(--mu);font-weight:700;font-size:14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;transition:.15s}
#nav button .ic{width:34px;height:34px}
#nav button:hover{color:var(--tx);border-color:#b84cf0}
#nav button.on{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 8px 24px #8a4cf050}
.cols{display:grid;grid-template-columns:repeat(5,minmax(240px,1fr));gap:12px;overflow-x:auto;padding-bottom:10px;align-items:start}
.col{background:var(--pan);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.col h3{margin:0;padding:14px;text-align:center;font-size:20px;font-weight:800;color:var(--c);background:linear-gradient(180deg,color-mix(in srgb,var(--c) 28%,var(--pan)),var(--pan))}
.col h3 small{font-size:13px;opacity:.6;margin-left:6px}
.p{width:100%;display:flex;align-items:center;gap:10px;padding:8px 12px;background:none;border:0;border-top:1px solid var(--line);cursor:pointer;text-align:left;transition:.12s}
.p:hover{background:var(--pan2)}
.p b{flex:1;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p svg.ch{width:18px;height:18px;flex:none;fill:none;stroke:var(--c);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.p .steve{width:32px;height:32px;border-radius:7px}
.none{padding:18px;text-align:center;color:var(--mu);font-size:14px}
.t1{--c:var(--t1)}.t2{--c:var(--t2)}.t3{--c:var(--t3)}.t4{--c:var(--t4)}.t5{--c:var(--t5)}
.r{width:100%;display:grid;grid-template-columns:60px minmax(200px,1fr) auto;gap:14px;align-items:center;padding:0 16px 0 0;min-height:68px;margin-bottom:8px;border:1px solid color-mix(in srgb,var(--c) 28%,var(--line));border-radius:14px;cursor:pointer;text-align:left;overflow:hidden;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 16%,var(--pan)),var(--pan) 65%);transition:.15s}
.r:hover{transform:translateX(3px);border-color:var(--c)}
.r.gm{box-shadow:0 0 26px color-mix(in srgb,var(--c) 24%,transparent)}
.rk{align-self:stretch;display:grid;place-items:center;font-size:24px;font-weight:800;color:var(--c);background:color-mix(in srgb,var(--c) 22%,var(--pan))}
.pl{display:flex;align-items:center;gap:12px;min-width:0}
.pl>div{min-width:0}.pl b{display:block;min-width:0;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ti{font-size:13px;font-weight:800;color:var(--c)}.ti span{color:var(--mu);font-weight:600}
.nl{display:flex;align-items:center;gap:8px;min-width:0}.rg{flex:none;font-size:11px;font-weight:800;padding:2px 7px;border-radius:6px;color:var(--rc);background:color-mix(in srgb,var(--rc) 16%,transparent);border:1px solid color-mix(in srgb,var(--rc) 45%,transparent)}.R-NA{--rc:#ff6b6b}.R-EU{--rc:#4cc38a}.R-AS{--rc:#b88cff}.R-SA{--rc:#ffb24a}.R-AU{--rc:#5aaeff}
.cells{display:flex;gap:8px}
.cl{width:50px;display:flex;flex-direction:column;align-items:center;gap:2px}
.cl small{font-size:11px;font-weight:800;color:var(--c);height:13px}
.cl.off .ic{opacity:.18;filter:grayscale(1)}
.steve{image-rendering:pixelated;border-radius:8px;flex:none;display:block;width:42px;height:42px;box-shadow:0 0 0 2px #ffffff22}
.empty{padding:30px;text-align:center;color:var(--mu)}
.b{display:inline-block;min-width:44px;padding:4px 8px;border-radius:8px;font-weight:800;font-size:13px;background:var(--pan2);border:1px solid var(--c);color:var(--c)}
.no{color:var(--mu);opacity:.5}
dialog{border:1px solid var(--line);background:var(--pan);color:var(--tx);border-radius:24px;padding:0;width:min(440px,92vw);overflow:hidden}
dialog::backdrop{background:#000b;backdrop-filter:blur(4px)}
.top{background:linear-gradient(135deg,color-mix(in srgb,var(--c) 70%,#6a5cff),#b84cf0 60%,#ff7eb3);padding:26px 20px 56px;text-align:center}
.top h3{margin:10px 0 8px;font-size:28px;font-weight:800;color:#fff}
.pill{display:inline-block;background:#0004;color:#fff;border-radius:99px;padding:4px 12px;font-weight:700;font-size:13px;margin:2px 3px}
.top .steve{width:92px;height:92px;margin:0 auto;border-radius:16px;box-shadow:0 0 0 3px #fff5}
.bd{padding:0 18px 20px;margin-top:-32px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g div{background:var(--pan2);border:1px solid var(--line);border-radius:12px;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600;font-size:14px}
.g div span{display:flex;align-items:center;gap:8px}.g .ic{width:26px;height:26px}
.x{margin-top:14px;width:100%;background:var(--pan2);border:1px solid var(--line);border-radius:12px;padding:12px;font-weight:700;cursor:pointer}
@media(max-width:760px){.r{grid-template-columns:48px 1fr;gap:8px 12px;padding:0 12px 12px 0}.rk{grid-row:1/3;font-size:20px}.cells{grid-column:2;justify-content:space-between}.cl{width:auto}.cols{grid-template-columns:repeat(5,min(78vw,300px))}.logo{font-size:30px}}
</style>
</head>

<div class="w">
<header><div class="logo">MMTC</div><div class="sp"></div><input id="q" type="search" placeholder="Search player…  ( / )" aria-label="Search player"></header>
<nav id="nav" aria-label="Gamemodes"></nav>
<main id="main"></main>
</div>
<dialog id="dlg"></dialog>
<script>
/* ====== EDIT HERE: your gamemodes and players ====== */
const MODES=[["overall","Overall"],["skywars","Skywars"],["midfight","Midfight"],["nodebuff","Nodebuff"],["mace","Mace"],["buhc","Build UHC"],["crystal","Crystal PvP"],["bedfight","Bedfight"]];
// name, region, {mode:"HT1"/"LT3"...}   (HT = high tier, LT = low tier)
const PLAYERS=[
"zbrvce","AS",{midfight:"LT3",nodebuff:"HT4"}],
];
// rank titles: minimum points, name, color. Combat Grandmaster is only for the #1 player.
const TITLES=[[150,"Combat Grandmaster","#ffc83d"],[100,"Combat Master","#ff8a3d"],[70,"Combat Ace","#c46bff"],[40,"Combat Specialist","#4ea1ff"],[20,"Combat Cadet","#4ed6a0"],[10,"Combat Novice","#9aa3bd"],[0,"Rookie","#6b7390"]];
/* ================================================== */
const BASE={1:60,2:44,3:28,4:16,5:6},pt=s=>Math.round(BASE[s[2]]*(s[0]=="H"?1:.75));
const SUB=MODES.slice(1),title=(p,top)=>top?TITLES[0]:TITLES.slice(1).find(t=>p>=t[0]);
const ic=id=>`<svg class="ic" aria-hidden="true"><use href="#i-${id}"/></svg>`;
const PAL={h:"#3a2615",s:"#b98462",w:"#fff",b:"#4a3b9c",n:"#8a5a3f",m:"#6b3f2a"};
const GRID=["hhhhhhhh","hhhhhhhh","hssssssh","swbssbws","sssnnsss","ssmmmmss","sssmmsss","ssssssss"];
const STEVE=`<svg class="steve" viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true">`+GRID.map((r,y)=>[...r].map((k,x)=>`<rect x="${x}" y="${y}" width="1" height="1" fill="${PAL[k]}"/>`).join("")).join("")+`</svg>`;
const CH=s=>`<svg class="ch" viewBox="0 0 24 24" aria-label="${s[0]=="H"?"High":"Low"} tier"><path d="${s[0]=="H"?"M6 11l6-6 6 6M6 19l6-6 6 6":"M6 15l6-6 6 6"}"/></svg>`;
const RG=r=>`<span class="rg R-${r}">${r}</span>`;
const badge=s=>s?`<span class="b t${s[2]}">${s}</span>`:`<span class="no">–</span>`;
const data=PLAYERS.map(([n,r,t])=>({n,r,t,p:Object.values(t).reduce((a,s)=>a+pt(s),0)})).sort((a,b)=>b.p-a.p);
data.forEach((p,i)=>{p.rank=i+1;p.ti=title(p.p,i==0)});
let cur="overall";
const nav=document.getElementById("nav"),main=document.getElementById("main"),q=document.getElementById("q"),dlg=document.getElementById("dlg");
nav.innerHTML=MODES.map(m=>`<button data-m="${m[0]}">${ic(m[0])}${m[1]}</button>`).join("");
nav.onclick=e=>{const b=e.target.closest("button");if(b){cur=b.dataset.m;draw()}};
q.oninput=draw;
addEventListener("keydown",e=>{if(e.key=="/"&&document.activeElement!=q&&!dlg.open){e.preventDefault();q.focus()}});
main.onclick=e=>{const r=e.target.closest("[data-i]");if(r)show(data[+r.dataset.i])};
function show(p){
 dlg.innerHTML=`<div class="top" style="--c:${p.ti[2]}">${STEVE}<h3>${p.n}</h3><span class="pill">${p.r}</span><span class="pill">${p.ti[1]}</span><span class="pill">#${p.rank} overall</span><span class="pill">${p.p} points</span></div>
 <div class="bd"><div class="g">${SUB.map(m=>`<div><span>${ic(m[0])}${m[1]}</span>${badge(p.t[m[0]])}</div>`).join("")}</div><button class="x" onclick="dlg.close()">Close</button></div>`;
 dlg.showModal();
}
dlg.onclick=e=>{if(e.target==dlg)dlg.close()};
function draw(){
 [...nav.children].forEach(b=>b.classList.toggle("on",b.dataset.m==cur));
 const f=q.value.trim().toLowerCase(),hit=p=>p.n.toLowerCase().includes(f),ix=p=>data.indexOf(p);
 if(cur=="overall"){
  main.innerHTML=data.filter(hit).map(p=>`<button class="r${p.rank==1?" gm":""}" style="--c:${p.ti[2]}" data-i="${ix(p)}"><span class="rk">${p.rank}</span><span class="pl">${STEVE}<div><div class="nl"><b>${p.n}</b>${RG(p.r)}</div><div class="ti">${p.ti[1]} <span>(${p.p} points)</span></div></div></span><span class="cells">${SUB.map(s=>{const t=p.t[s[0]];return `<span class="cl${t?"":" off"} ${t?"t"+t[2]:""}" title="${s[1]}">${ic(s[0])}<small>${t||""}</small></span>`}).join("")}</span></button>`).join("")||`<div class="empty">No players found.</div>`;
 }else{
  main.innerHTML=`<div class="cols">`+[1,2,3,4,5].map(t=>{
   const ps=data.filter(p=>p.t[cur]&&+p.t[cur][2]==t&&hit(p)).sort((a,b)=>(a.t[cur][0]=="H"?0:1)-(b.t[cur][0]=="H"?0:1)||a.n.localeCompare(b.n));
   return `<section class="col t${t}"><h3>${["🥇 ","🥈 ","🥉 ","",""][t-1]}Tier ${t}<small>${ps.length}</small></h3>`+(ps.map(p=>`<button class="p" data-i="${ix(p)}">${STEVE}<b>${p.n}</b>${RG(p.r)}${CH(p.t[cur])}</button>`).join("")||`<div class="none">No players</div>`)+`</section>`}).join("")+`</div>`;
 }
}
draw();
</script>
</body>
</html>
